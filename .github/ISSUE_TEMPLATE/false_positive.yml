name: False-positive report
description: Report a detector match that should remain clean.
title: "[False positive] "
body:
  - type: markdown
    attributes:
      value: |
        Use only an abstract minimal reproduction. Do not paste the original proprietary
        source, local `.pitlore/`, private Lesson/review content, or evidence ledger.
        This report is not a usefulness grade and does not change Lesson lifecycle state.
  - type: input
    id: lesson
    attributes:
      label: Lesson or detector ID
      placeholder: "lesson-id"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PitLore and Pack version
      description: Include the exact PitLore version or commit and Pack version when applicable.
      placeholder: "PitLore 0.1.0; pack 1.2.3"
    validations:
      required: true
  - type: textarea
    id: minimal_input
    attributes:
      label: Abstract minimal input
      description: Provide the smallest non-proprietary example that incorrectly matches.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: Explain why the example should remain clean and include the sanitized finding.
    validations:
      required: true
  - type: dropdown
    id: gate_pressure
    attributes:
      label: Did this create pressure to disable the gate?
      options:
        - "No"
        - "Yes"
        - "Not applicable"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I used an abstract reproduction and removed private source, lore/reviews/evidence, secrets, PII, customer data, and internal hosts.
          required: true
