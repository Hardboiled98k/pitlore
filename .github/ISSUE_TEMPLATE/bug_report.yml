name: Bug report
description: Report a reproducible PitLore defect using a sanitized example.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PitLore. Do not include secrets, private Lessons,
        evidence ledgers, customer data, proprietary source, or internal hosts.
        Report suspected vulnerabilities through the private security channel instead.
  - type: input
    id: version
    attributes:
      label: PitLore version or commit
      description: Paste the exact version, release tag, or full Git commit.
      placeholder: "0.1.0 or 0123456789abcdef..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the Node.js version, operating system, and CPU architecture.
      placeholder: "Node.js 22.18.0, macOS 15.5, arm64"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - GitHub release tag
        - GitHub commit
        - GitHub branch
        - npm package tarball
        - npm registry
        - Local source checkout
        - Docker self-host
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List exact sanitized commands and inputs needed to reproduce the problem.
      placeholder: |
        1. Run ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect PitLore to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
      description: Include the complete error text when safe. Redact local paths and private data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed secrets, private lore/evidence, PII, customer data, proprietary source, and internal hosts.
          required: true
        - label: This is not a security vulnerability or suspected private-data exposure.
          required: true
