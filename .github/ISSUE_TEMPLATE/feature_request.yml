name: Feature request
description: Propose a scoped PitLore feature or compatibility improvement.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and trust-boundary impact before proposing an implementation.
        Never include private Lessons, evidence, proprietary source, credentials, or customer data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user problem cannot be solved with the current behavior?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful user-visible behavior and CLI, MCP, Pack, or Registry surface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workaround or smaller alternative did you consider?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Trust, privacy, and compatibility impact
      description: Note human-approval, local-first, migration, SemVer, rollback, and public/private-data implications.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed secrets, private lore/evidence, PII, customer data, proprietary source, and internal hosts.
          required: true
