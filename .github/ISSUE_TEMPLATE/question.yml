name: Question
description: Ask a sanitized installation, usage, or documentation question.
title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Check SUPPORT.md and docs/TROUBLESHOOTING.md first. Do not include secrets,
        private Lessons/reviews/evidence, customer data, proprietary source, or internal hosts.
        Suspected vulnerabilities and private-data exposure belong in the private security channel.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation or upgrade
        - CLI usage
        - MCP integration
        - Pack authoring or installation
        - Self-hosted Registry
        - Documentation
        - Other public usage
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PitLore version or commit
      description: Include the exact version, release tag, or full Git commit when applicable.
      placeholder: "0.1.0 or 0123456789abcdef..."
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you are trying to accomplish and where you are blocked.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include sanitized commands, documentation links, and results when useful.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed secrets, private lore/evidence, PII, customer data, proprietary source, and internal hosts.
          required: true
        - label: This is not a security vulnerability or suspected private-data exposure.
          required: true
