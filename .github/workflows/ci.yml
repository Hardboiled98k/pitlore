name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm run audit:prod
      - name: Audit full build dependency tree (high and critical)
        if: runner.os == 'Linux'
        run: npm run audit:build
      # Windows process startup is materially slower for the CLI-heavy suites.
      # Bound worker contention there instead of weakening assertions, adding
      # retries, or raising the repository-wide test timeout.
      - name: Test (Windows, bounded workers)
        if: runner.os == 'Windows'
        run: npm test -- --maxWorkers=1
      - name: Test
        if: runner.os != 'Windows'
        run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run demo:tenant

  package-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: mkdir -p package-artifact
      - run: npm pack --pack-destination package-artifact --silent
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitlore-npm-package
          path: package-artifact/*.tgz
          if-no-files-found: error
          retention-days: 7

  consumer-install:
    needs: package-artifact
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
          - 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pitlore-npm-package
          path: package-artifact
      - run: npm run test:package -- package-artifact
      - run: npm run test:git-install

  self-host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm run test:self-host

  required:
    name: CI required
    if: always()
    needs:
      - verify
      - package-artifact
      - consumer-install
      - self-host
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI gate
        env:
          PITLORE_CONSUMER_INSTALL_RESULT: ${{ needs.consumer-install.result }}
          PITLORE_PACKAGE_ARTIFACT_RESULT: ${{ needs.package-artifact.result }}
          PITLORE_SELF_HOST_RESULT: ${{ needs.self-host.result }}
          PITLORE_VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          for PITLORE_RESULT in \
            "$PITLORE_VERIFY_RESULT" \
            "$PITLORE_PACKAGE_ARTIFACT_RESULT" \
            "$PITLORE_CONSUMER_INSTALL_RESULT" \
            "$PITLORE_SELF_HOST_RESULT"
          do
            if [ "$PITLORE_RESULT" != "success" ]; then
              echo "A required CI dependency concluded: $PITLORE_RESULT" >&2
              exit 1
            fi
          done
