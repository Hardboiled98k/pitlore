id: tenant-query-requires-tenant-id
version: 0.1.0
title: Tenant-owned records must be queried with tenantId
languages:
  - typescript
ecosystems:
  - prisma
category: security
symptom: A database query can return records owned by another tenant.
root_cause: The repository method queried a tenant-owned model without binding tenantId in its filter.
forbid_pattern_abstract: Querying tenant-owned models without tenantId in the query arguments.
safe_pattern_abstract: Require tenantId at the repository boundary and include it in every tenant-owned query filter.
scope:
  paths:
    - fixtures/**/*.ts
  confidence_min: 0.9
severity: block
confidence: 0.95
sources:
  count: 1
  references:
    - phase-1-tenant-isolation-demo
enforcement:
  test_idea: Run the detector against a missing-tenant fixture and a tenant-scoped control fixture.
  detector_ref: null
  patterns:
    - 'db\.\w+\.(?:findMany|findFirst|updateMany|deleteMany)\s*\(\s*\{(?:(?!tenantId)[\s\S]){0,500}?\}\s*\)'
  fixtures:
    bad:
      - fixtures/bad/tenant-missing.ts
    good:
      - fixtures/good/tenant-scoped.ts
tags:
  - multi-tenant
  - tenant-isolation
  - database
status: candidate
visibility: private
created_at: '2026-07-15T00:00:00.000Z'
updated_at: '2026-07-15T00:00:00.000Z'
